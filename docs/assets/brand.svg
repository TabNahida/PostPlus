<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">PostPlus — Your mail. Your space.</title>
  <desc id="desc">PostPlus branding with a P+ mark and an illustrated envelope on a warm green background.</desc>
  <defs><pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#f4efdc" stroke-opacity=".04"/></pattern></defs>
  <rect width="1200" height="430" rx="22" fill="#253f34"/>
  <rect width="1200" height="430" rx="22" fill="url(#grid)"/>
  <g transform="translate(64 53)"><rect width="60" height="60" rx="15" fill="none" stroke="#f4efdc" stroke-width="1.5"/><path d="M16 46V16h11a11 11 0 0 1 0 22h-5v8h-6zm6-14h5a5 5 0 0 0 0-10h-5v10z" fill-rule="evenodd" fill="#f4efdc"/><path d="M45 9v14m-7-7h14" stroke="#e6a471" stroke-width="3" stroke-linecap="round"/></g>
  <text x="142" y="94" fill="#f4efdc" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="650" letter-spacing="-1">PostPlus</text>
  <text x="64" y="203" fill="#f4efdc" font-family="Georgia,serif" font-size="59">Your mail. Your space.</text>
  <text x="67" y="250" fill="#c8d3c2" font-family="Segoe UI,Arial,sans-serif" font-size="20">A welcoming home for your email.</text>
  <g font-family="Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="1.5" fill="#d9e2ce"><text x="67" y="350">YOUR DOMAIN</text><circle cx="206" cy="345" r="2" fill="#e6a471"/><text x="228" y="350">YOUR PEOPLE</text><circle cx="360" cy="345" r="2" fill="#e6a471"/><text x="382" y="350">YOUR CONTROL</text></g>
  <g transform="translate(795 119) rotate(-12 155 102)"><rect x="5" y="15" width="300" height="204" rx="8" fill="#172f25" opacity=".7"/><rect width="300" height="204" rx="5" fill="#eee8cc"/><path d="M0 0l150 109L300 0M0 204l114-104m186 104L188 100" fill="none" stroke="#d3cdb1" stroke-width="2"/><rect x="224" y="23" width="53" height="59" rx="2" fill="#e6a471" stroke="#eee8cc" stroke-width="4" stroke-dasharray="3 4"/><text x="234" y="61" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="650" fill="#674e34">P+</text><path d="M31 143h84m-84 18h56" stroke="#a7aa8f" stroke-width="2"/></g>
  <path d="M1130 300v26m-13-13h26" stroke="#b8c6ad" stroke-opacity=".6" stroke-width="2"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">One home for your mail, from setup to everyday use</title>
  <desc id="desc">An illustrated product overview of guided setup, server administration, and a personal mailbox. These are simplified illustrations, not application screenshots.</desc>
  <rect width="1200" height="460" rx="20" fill="#f4f4ec"/>
  <g font-family="Segoe UI,Arial,sans-serif" fill="#253f34"><text x="44" y="53" font-size="23" font-weight="600">From the first setup to the next hello.</text><text x="44" y="81" font-size="13" fill="#6d7b63">A guided start. A clear overview. A little room to read.</text></g>
  <g transform="translate(44 112)"><rect width="352" height="261" rx="12" fill="#fff" stroke="#e0e5da"/><path d="M12 0h328a12 12 0 0 1 12 12v28H0V12A12 12 0 0 1 12 0" fill="#e8ecdf"/><g fill="#9ca891"><circle cx="17" cy="20" r="3"/><circle cx="29" cy="20" r="3"/><circle cx="41" cy="20" r="3"/></g><g font-family="Segoe UI,Arial,sans-serif"><text x="24" y="73" fill="#253f34" font-size="16" font-weight="600">Let's make it yours.</text><text x="24" y="100" fill="#6d7b63" font-size="11">Mail domain</text><rect x="24" y="110" width="304" height="31" rx="5" fill="#fafbf7" stroke="#dce3d4"/><text x="35" y="130" fill="#253f34" font-size="11">example.com</text><text x="24" y="165" fill="#6d7b63" font-size="11">First administrator</text><rect x="24" y="175" width="304" height="31" rx="5" fill="#fafbf7" stroke="#dce3d4"/><text x="35" y="195" fill="#253f34" font-size="11">admin@example.com</text><rect x="24" y="222" width="142" height="25" rx="5" fill="#253f34"/><text x="37" y="238" fill="#fff" font-size="10">Save and start →</text></g></g>
  <g transform="translate(424 112)"><rect width="352" height="261" rx="12" fill="#fafbf7" stroke="#e0e5da"/><path d="M12 0h72v261H12A12 12 0 0 1 0 249V12A12 12 0 0 1 12 0" fill="#253f34"/><g font-family="Segoe UI,Arial,sans-serif"><text x="17" y="33" font-size="18" fill="#f4efdc" font-weight="600">P+</text><g font-size="8" fill="#c8d3c2"><text x="14" y="77">Overview</text><text x="14" y="102">Accounts</text><text x="14" y="127">Queue</text><text x="14" y="152">Logs</text><text x="14" y="177">Settings</text></g><text x="104" y="38" fill="#253f34" font-size="15" font-weight="600">A view of your server.</text><g fill="#fff" stroke="#e0e5da"><rect x="104" y="62" width="102" height="68" rx="6"/><rect x="221" y="62" width="110" height="68" rx="6"/><rect x="104" y="148" width="227" height="84" rx="6"/></g><text x="116" y="83" fill="#6d7b63" font-size="9">Messages</text><text x="235" y="83" fill="#6d7b63" font-size="9">Queued</text><text x="116" y="114" fill="#253f34" font-size="23">128</text><text x="235" y="114" fill="#253f34" font-size="23">0</text><text x="117" y="171" fill="#253f34" font-size="11">Your next steps</text><path d="M118 187h145m-145 13h176m-176 13h122" stroke="#d6decf" stroke-width="4" stroke-linecap="round"/></g></g>
  <g transform="translate(804 112)"><rect width="352" height="261" rx="12" fill="#fafbf7" stroke="#e0e5da"/><path d="M12 0h45v261H12A12 12 0 0 1 0 249V12A12 12 0 0 1 12 0" fill="#253f34"/><text x="14" y="33" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#f4efdc" font-weight="600">P+</text><rect x="12" y="58" width="33" height="26" rx="5" fill="#e6a471"/><path d="M23 71h11m-5.5-5.5v11" stroke="#253f34" stroke-width="1.5"/><path d="M69 84h269M178 85v176" stroke="#e0e5da"/><g font-family="Segoe UI,Arial,sans-serif" fill="#253f34"><text x="75" y="40" font-size="19" font-weight="600">Inbox.</text><text x="75" y="69" font-size="9" fill="#6d7b63">All messages</text><rect x="59" y="86" width="118" height="56" fill="#edf1e6"/><g font-size="10"><text x="74" y="110">A little good news</text><text x="74" y="126" fill="#6d7b63">hello@example.com</text><text x="74" y="167">Welcome aboard</text><text x="74" y="184" fill="#6d7b63">team@example.com</text></g><text x="194" y="111" font-size="13" font-weight="600">A little good news</text><text x="194" y="144" font-size="10">Hello,</text><path d="M195 162h119m-119 13h129m-129 13h105m-105 26h68" stroke="#cbd5c3" stroke-width="4" stroke-linecap="round"/></g></g>

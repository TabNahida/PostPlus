name: Build and test
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
        mode: [debug, release]
        include:
          - os: windows-latest
            configure: '--runtimes=MT'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.1.1'
          actions-cache-folder: '.xmake-cache'
          actions-cache-key: '${{ runner.os }}-${{ runner.arch }}-${{ matrix.mode }}-pace-020-static-v3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Linux service installer checks
        if: runner.os == 'Linux'
        run: python tests/systemd_install_test.py
      - name: Configure
        run: xmake f -m ${{ matrix.mode }} ${{ matrix.configure }} -y
      - name: Build all services
        run: xmake build -y
      - name: Unit tests
        run: xmake test -v
      - name: Release module manifest checks
        run: |
          python tests/release_manifest_test.py
          python tests/release_ci_test.py
      - name: Web language and asset checks
        run: node tests/web_test.js
      - name: HTML mail and forwarded-message reader checks
        run: node tests/mail_reader_test.js
      - name: Search and delivery status controls
        run: node tests/mail_tools_ui_test.js
      - name: Attachment and composer controls
        run: node tests/composer_ui_test.js
      - name: DNS guide and DKIM controls
        run: node tests/dns_ui_test.js
      - name: Display settings and preference checks
        run: node tests/preferences_ui_test.js
      - name: Administration API key and restart controls
        run: |
          node tests/api_keys_ui_test.js
          node tests/security_ui_test.js
          node tests/abuseipdb_ui_test.js
          node tests/abuseipdb_ui_test.js
          node tests/verification_code_ui_test.js
          node tests/multi_domain_ui_test.js
          node tests/domain_management_ui_test.js
          node tests/access_ui_test.js
          node tests/logs_ui_test.js
          node tests/restart_ui_test.js
          node tests/mail_clients_ui_test.js
          node tests/update_ui_test.js
      - name: Mailbox, protocol, setup, maintenance and supervisor integration
        run: python tests/integration.py --build-dir build --mode ${{ matrix.mode }}
      - name: Upload diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ runner.os }}-${{ matrix.mode }}
          path: |
            build/test-runs/**/*.log
            build/test-runs/**/*.jsonl*
          retention-days: 7

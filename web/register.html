<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><title>PostPlus · Create mailbox</title><link rel="icon" href="/favicon.svg"><script src="/preferences.js"></script><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/preferences.css"><script src="/i18n.js" defer></script><script src="/register.js" defer></script></head><body><main class="registration-page"><section class="login-panel"><div class="login-box"><a class="brand" href="/">PostPlus</a><h1 data-i18n>Create your mailbox</h1><p id="register-status" role="status" data-i18n>Checking invitation…</p><p id="register-error" class="form-error" role="alert" hidden></p><form id="register-form" hidden><label for="register-localpart" data-i18n>Mailbox name</label><div class="address-input"><input id="register-localpart" autocomplete="username" maxlength="64" required><span id="register-domain"></span></div><label for="register-password" data-i18n>Password</label><input id="register-password" type="password" autocomplete="new-password" required><p id="register-policy" class="field-hint"></p><label for="register-confirm" data-i18n>Confirm password</label><input id="register-confirm" type="password" autocomplete="new-password" required><button id="register-submit" type="submit" class="button primary" data-i18n>Create mailbox</button></form><a id="register-login" class="button secondary" href="/" hidden data-i18n>Open Webmail</a></div></section></main></body></html>
